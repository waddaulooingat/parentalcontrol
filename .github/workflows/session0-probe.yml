name: Session 0 WindowMonitor Probe

# Throwaway diagnostic: confirms whether a Windows Service (Session 0, no interactive
# desktop) can see the foreground window of the runner's interactive logon session, and
# whether ParentalGuard.Core's WindowMonitor detects a real browser window from there.
# Not part of the ParentalGuard product - see claude_handover.md for context.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish probe
        shell: pwsh
        run: dotnet publish ParentalGuard.SessionZeroProbe/ParentalGuard.SessionZeroProbe.csproj -c Release -o "${{ github.workspace }}\publish"

      - name: Install and start probe as a real Windows Service
        shell: pwsh
        run: |
          $exe = "${{ github.workspace }}\publish\ParentalGuard.SessionZeroProbe.exe"
          sc.exe create ParentalGuardSessionZeroProbe binPath= "$exe" start= demand
          sc.exe start ParentalGuardSessionZeroProbe

      - name: Open a real browser window in the interactive runner session
        shell: pwsh
        run: |
          Start-Process "msedge.exe" -ArgumentList "--new-window","data:text/html,<title>parentalguard-probe-test.example.com</title><body>Session 0 probe test page</body>"
          Start-Sleep -Seconds 5

      - name: Wait for the probe's 20 x 2s polling loop to finish
        shell: pwsh
        run: Start-Sleep -Seconds 50

      - name: Stop probe service (best-effort; it self-stops when done)
        shell: pwsh
        continue-on-error: true
        run: sc.exe stop ParentalGuardSessionZeroProbe

      - name: Show probe log
        shell: pwsh
        run: |
          if (Test-Path "C:\ParentalGuardTest\probe.log") {
            Get-Content "C:\ParentalGuardTest\probe.log"
          } else {
            Write-Host "No probe log found - service may have failed to start."
            sc.exe query ParentalGuardSessionZeroProbe
          }

      - name: Upload probe log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session0-probe-log
          path: C:\ParentalGuardTest\probe.log
          if-no-files-found: warn

      - name: Remove probe service
        if: always()
        shell: pwsh
        continue-on-error: true
        run: sc.exe delete ParentalGuardSessionZeroProbe
